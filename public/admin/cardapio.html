<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio — Javari StrEat Park</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }
        .header{background:linear-gradient(135deg,#1a1a1a 0%,#2d1640 50%,#1a1a1a 100%);padding:16px 20px;text-align:center;position:relative;border-radius:12px 12px 0 0;box-shadow:0 4px 12px rgba(79,25,100,.2)}
        .header h1{color:#fff;font-size:1.3em;font-weight:700;letter-spacing:.5px}
        .header p{color:rgba(255,255,255,.6);font-size:.75em;margin-top:3px}
        .header .logout-btn{position:absolute;top:50%;right:16px;transform:translateY(-50%);background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:background .2s}
        .header .logout-btn:hover{background:rgba(255,255,255,.18)}
        .admin-nav{display:flex;background:#fff;overflow-x:auto;box-shadow:0 4px 8px rgba(0,0,0,.06);border-radius:0 0 12px 12px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
        .admin-nav a{flex:1;min-width:0;text-align:center;padding:12px 6px;text-decoration:none;color:#666;font-weight:600;font-size:12px;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
        .admin-nav a:hover{background:#f8f9fa}
        .admin-nav a.active{color:#4f1964;border-bottom-color:#4f1964;background:#f5f0f8}

        .section-card { background: white; padding: 12px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 14px; }

        .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
        .cat-tabs::-webkit-scrollbar { height: 4px; }
        .cat-tabs::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .cat-tab { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid #ddd; background: white; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; color: #555; }
        .cat-tab:hover { border-color: #4a90e2; color: #4a90e2; }
        .cat-tab.active { background: #4a90e2; color: white; border-color: #4a90e2; }

        .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .add-btn { display: inline-flex; align-items: center; gap: 6px; background: #4a90e2; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; }
        .add-btn:hover { background: #357abd; }
        .add-btn.secondary { background: #6b7280; }
        .add-btn.secondary:hover { background: #4b5563; }
        .add-btn.danger { background: #e53e3e; }
        .add-btn.danger:hover { background: #c53030; }
        .add-btn.success { background: #38a169; }
        .add-btn.success:hover { background: #2f855a; }

        .item-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; transition: border-color .2s; }
        .item-card:hover { border-color: #4a90e2; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: .95em; color: #222; }
        .item-desc { font-size: .82em; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { font-weight: 700; color: #4a90e2; font-size: .95em; white-space: nowrap; }
        .item-price.consult { color: #999; font-weight: 500; font-style: italic; }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .item-actions button { background: none; border: 1px solid #ddd; border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px; transition: all .2s; }
        .item-actions .edit-btn:hover { border-color: #4a90e2; color: #4a90e2; }
        .item-actions .delete-btn:hover { border-color: #e53e3e; color: #e53e3e; }

        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .empty-state p { font-size: .95em; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,.6); justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background-color: #fefefe; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,.2); width: 90%; max-width: 480px; position: relative; transform: scale(.95); opacity: 0; animation: fadeInScale .3s forwards; }
        @keyframes fadeInScale { to { transform: scale(1); opacity: 1; } }
        .close-button { color: #aaa; position: absolute; top: 15px; right: 25px; font-size: 28px; font-weight: bold; cursor: pointer; transition: color .2s; }
        .close-button:hover { color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1em; font-family: inherit; transition: border-color .2s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74,144,226,.2); }
        .submit-button { background-color: #4a90e2; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: 600; transition: background-color .2s ease; width: 100%; }
        .submit-button:hover { background-color: #357ABD; }

        .confirm-modal .modal-content { max-width: 380px; text-align: center; }
        .confirm-modal p { margin-bottom: 20px; font-size: 1em; color: #555; }
        .confirm-actions { display: flex; gap: 12px; }
        .confirm-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: .95em; border: none; }
        .confirm-cancel { background: #e5e7eb; color: #333; }
        .confirm-delete { background: #e53e3e; color: white; }

        .message-box { display: none; position: fixed; z-index: 1001; left: 50%; top: 50%; transform: translate(-50%,-50%); background-color: #4CAF50; color: white; padding: 15px 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,.2); font-size: 1.1em; text-align: center; opacity: 0; animation: fadeInOut 3s forwards; }
        .message-box.error { background-color: #e53e3e; }
        @keyframes fadeInOut { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; display: none; } }

        .auth-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 18px; color: #777; }

        .cat-count { font-size: 12px; color: #999; font-weight: 400; margin-left: 4px; }
        .items-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .items-header h3 { font-size: 1.05em; font-weight: 700; color: #333; }
        .modal-title{font-size:1.15em;font-weight:700;margin-bottom:16px;color:#333}
        .import-note{font-size:13px;color:#888;margin-bottom:14px}
        .import-status{font-size:13px;text-align:center;margin-top:10px}
        .items-actions{display:flex;gap:8px}

        /* Section sub-tabs */
        .sub-tabs{display:flex;gap:0;border-bottom:2px solid #eee;margin-bottom:14px}
        .sub-tab{padding:9px 16px;font-size:13px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap}
        .sub-tab:hover{color:#555}
        .sub-tab.active{color:#4f1964;border-bottom-color:#4f1964}
        .sub-panel{display:none}
        .sub-panel.active{display:block}
        .sub-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
        .sub-tab{font-size:12px;padding:8px 12px}

        /* Consumer tables */
        .cons-table{width:100%;border-collapse:collapse;font-size:12px}
        .cons-table th{text-align:left;padding:8px 10px;background:#f8f9fa;color:#666;font-weight:600;border-bottom:2px solid #eee;white-space:nowrap;cursor:pointer;user-select:none}
        .cons-table th:hover{color:#4f1964}
        .cons-table td{padding:7px 10px;border-bottom:1px solid #f0f0f0;color:#444}
        .cons-table tr:hover td{background:#f8f9fa}
        .cons-table td,.cons-table th{font-size:11px;padding:6px 8px}
        .cons-filter{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
        .cons-filter input,.cons-filter select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit}
        .cons-filter input{flex:1;min-width:150px}
        .cons-count{font-size:11px;color:#999;margin-left:auto}
        .cons-kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
        .cons-kpi-card{background:#f8f9fa;border-radius:10px;padding:12px 14px}
        .cons-kpi-label{font-size:9px;font-weight:700;color:#999;text-transform:uppercase}
        .cons-kpi-value{font-size:1.2em;font-weight:700;color:#222;margin-top:2px}
        .stock-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
        .stock-baixo{background:#fee2e2;color:#991b1b}
        .stock-atencao{background:#fef3c7;color:#92400e}
        .stock-ok{background:#d1fae5;color:#065f46}

        @media(min-width:640px){
            .cons-kpi{grid-template-columns:repeat(4,1fr)}
            .cons-table td,.cons-table th{font-size:12px;padding:7px 10px}
            .sub-tab{font-size:13px;padding:9px 16px}
            .container{padding:20px}
            .header h1{font-size:1.6em}
            .admin-nav a{font-size:13px;padding:13px 8px}
            .section-card{padding:16px}
        }
    </style>
</head>
<body>
    <div id="auth-loading" class="auth-loading">Verificando autenticação...</div>

    <div class="container" id="app-container" style="display:none;">
        <header class="header">
            <h1>Cardápio</h1>
            <p id="user-email-display"></p>
            <button class="logout-btn" id="logoutBtn">Sair</button>
        </header>

        <nav class="admin-nav">
            <a href="/admin/dashboard.html">Dashboard</a>
            <a href="/admin/reservas.html">Reservas</a>
            <a href="/admin/agenda.html">Agenda</a>
            <a href="/admin/cardapio.html" class="active">Cardápio</a>
            <a href="/admin/blog.html">Blog</a>
        </nav>

        <!-- Sub-tabs -->
        <div class="sub-tabs">
            <div class="sub-tab active" data-sub="cardapio">Cardápio</div>
            <div class="sub-tab" data-sub="produtos">Produtos Consumer</div>
            <div class="sub-tab" data-sub="insumos">Insumos</div>
            <div class="sub-tab" data-sub="estoque">Estoque</div>
        </div>

        <!-- SUB: Cardápio (read-only mirror from Consumer POS) -->
        <div class="sub-panel active" id="sub-cardapio">
            <div class="section-card">
                <p id="cardapio-sync-info" style="font-size:12px;color:#888;margin-bottom:10px"></p>
                <div class="cons-kpi" id="cardapio-kpis"></div>
                <div class="cons-filter">
                    <input type="text" id="cardapio-search" placeholder="Buscar item…">
                    <select id="cardapio-cat-filter"><option value="">Todas categorias</option></select>
                    <span class="cons-count" id="cardapio-count"></span>
                </div>
            </div>
            <div id="cardapio-categories"></div>
        </div>

        <!-- SUB: Produtos Consumer -->
        <div class="sub-panel" id="sub-produtos">
            <div class="section-card">
                <div class="cons-kpi" id="prod-kpis"></div>
                <div class="cons-filter">
                    <input type="text" id="prod-search" placeholder="Buscar produto…">
                    <select id="prod-cat-filter"><option value="">Todas categorias</option></select>
                    <span class="cons-count" id="prod-count"></span>
                </div>
                <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:600px;overflow-y:auto">
                    <table class="cons-table" id="tbl-produtos">
                        <thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th></tr></thead>
                        <tbody id="prod-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SUB: Insumos -->
        <div class="sub-panel" id="sub-insumos">
            <div class="section-card">
                <div class="cons-kpi" id="ins-kpis"></div>
                <div class="cons-filter">
                    <input type="text" id="ins-search" placeholder="Buscar insumo…">
                    <select id="ins-cat-filter"><option value="">Todas categorias</option></select>
                    <span class="cons-count" id="ins-count"></span>
                </div>
                <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:600px;overflow-y:auto">
                    <table class="cons-table" id="tbl-insumos">
                        <thead><tr><th>Nome</th><th>Categoria</th></tr></thead>
                        <tbody id="ins-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SUB: Estoque -->
        <div class="sub-panel" id="sub-estoque">
            <div class="section-card">
                <div class="cons-kpi" id="estoque-kpis"></div>
                <div class="cons-filter">
                    <input type="text" id="estoque-search" placeholder="Buscar produto ou insumo…">
                    <select id="estoque-status-filter">
                        <option value="">Todos</option>
                        <option value="baixo">Estoque baixo</option>
                        <option value="atencao">Atenção</option>
                        <option value="ok">OK</option>
                    </select>
                    <select id="estoque-cat-filter"><option value="">Todas categorias</option></select>
                    <span class="cons-count" id="estoque-count"></span>
                </div>
                <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:600px;overflow-y:auto">
                    <table class="cons-table" id="tbl-estoque">
                        <thead><tr><th>Produto/Insumo</th><th>Categoria</th><th style="text-align:right">Atual</th><th style="text-align:right">Mínimo</th><th>Status</th></tr></thead>
                        <tbody id="estoque-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="message-box" class="message-box"></div>

    <script>
        const $ = id => document.getElementById(id);
        const messageBox = $('message-box');

        // Auth guard (localStorage with TTL)
        const AUTH_KEY = 'javari_admin_auth';
        const AUTH_TTL = 24 * 60 * 60 * 1000;
        let session = JSON.parse(localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY) || 'null');
        if (session && !localStorage.getItem(AUTH_KEY)) localStorage.setItem(AUTH_KEY, JSON.stringify(session));
        if (session && session.ts && (Date.now() - session.ts > AUTH_TTL)) { session = null; localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); }
        if (!session) { window.location.href = '/admin/index.html'; }
        $('auth-loading').style.display = 'none';
        $('app-container').style.display = 'block';
        $('user-email-display').textContent = session ? session.email : '';

        $('logoutBtn').addEventListener('click', () => { localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); window.location.href = '/admin/index.html'; });

        function showMessage(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.className = 'message-box' + (type === 'error' ? ' error' : '');
            messageBox.style.display = 'block';
            messageBox.style.animation = 'none';
            void messageBox.offsetWidth;
            messageBox.style.animation = 'fadeInOut 3s forwards';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function fmtBRL(v) { return 'R$ ' + (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
        function fmtDateBR(s) { if(!s) return '—'; const p=s.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:'—'; }

        // ── Sub-tabs switching ──
        document.querySelectorAll('.sub-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.sub-panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                $('sub-' + tab.dataset.sub).classList.add('active');
            });
        });

        // ── Load all data from Consumer POS sync ──
        let cardapioData = null;
        let consumerProdutos = [];
        let consumerInsumos = [];
        let estoqueData = [];

        async function loadAllData() {
            try {
                const [cardRes, prodRes, estRes] = await Promise.all([
                    fetch('/data/cardapio.json'),
                    fetch('/data/produtos-consumer.json'),
                    fetch('/data/estoque.json')
                ]);
                cardapioData = await cardRes.json();
                const prodData = await prodRes.json();
                consumerProdutos = prodData.produtos || [];
                consumerInsumos = prodData.insumos || [];
                const estData = await estRes.json();
                estoqueData = estData.itens || [];

                renderCardapio();
                renderConsumerProdutos();
                renderConsumerInsumos();
                renderEstoque(estData);
            } catch (e) {
                console.warn('Erro ao carregar dados Consumer:', e);
            }
        }
        loadAllData();

        // ── Cardápio (read-only from Consumer POS) ──
        function renderCardapio() {
            if (!cardapioData) return;
            const cats = cardapioData.categories || [];
            const totalProdutos = cats.reduce((s, c) => s + c.items.length, 0);
            const syncInfo = cardapioData.syncedAt ? `Sync: ${fmtDateBR(cardapioData.syncedAt.split('T')[0])} — Fonte: ${cardapioData.source || 'Consumer POS'}` : '';

            $('cardapio-sync-info').textContent = syncInfo;
            $('cardapio-kpis').innerHTML = `
                <div class="cons-kpi-card"><div class="cons-kpi-label">Itens no Cardápio</div><div class="cons-kpi-value">${totalProdutos}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Categorias</div><div class="cons-kpi-value">${cats.length}</div></div>
            `;

            const sel = $('cardapio-cat-filter');
            sel.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option value="${escapeHtml(c.category)}">${escapeHtml(c.category)}</option>`).join('');

            function render() {
                const search = ($('cardapio-search')?.value || '').toLowerCase();
                const catFilter = $('cardapio-cat-filter')?.value || '';

                let filteredCats = cats;
                if (catFilter) filteredCats = filteredCats.filter(c => c.category === catFilter);

                let totalShown = 0;
                const container = $('cardapio-categories');
                container.innerHTML = filteredCats.map(cat => {
                    let items = cat.items || [];
                    if (search) items = items.filter(i => (i.name||'').toLowerCase().includes(search));
                    if (items.length === 0) return '';
                    totalShown += items.length;

                    const rows = items.map(i =>
                        `<tr><td>${escapeHtml(i.name)}</td><td style="text-align:right;white-space:nowrap">${fmtBRL(i.price)}</td></tr>`
                    ).join('');

                    return `<div class="section-card" style="margin-bottom:12px">
                        <h3 style="font-size:.85em;font-weight:700;color:#4f1964;margin-bottom:8px">${escapeHtml(cat.category)} <span style="font-weight:400;color:#999;font-size:.85em">(${items.length})</span></h3>
                        <div style="overflow-x:auto"><table class="cons-table"><thead><tr><th>Item</th><th style="text-align:right;width:100px">Preço</th></tr></thead><tbody>${rows}</tbody></table></div>
                    </div>`;
                }).join('');

                $('cardapio-count').textContent = `${totalShown} ite${totalShown !== 1 ? 'ns' : 'm'}`;
            }
            render();
            $('cardapio-search')?.addEventListener('input', render);
            sel.addEventListener('change', render);
        }

        // ── Produtos Consumer ──
        function renderConsumerProdutos() {
            const cats = [...new Set(consumerProdutos.map(p => p.categoria).filter(Boolean))].sort();

            $('prod-kpis').innerHTML = `
                <div class="cons-kpi-card"><div class="cons-kpi-label">Total Produtos</div><div class="cons-kpi-value">${consumerProdutos.length}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Categorias</div><div class="cons-kpi-value">${cats.length}</div></div>
            `;

            const sel = $('prod-cat-filter');
            sel.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

            function render() {
                const search = ($('prod-search')?.value || '').toLowerCase();
                const catFilter = $('prod-cat-filter')?.value || '';
                let filtered = consumerProdutos;
                if (search) filtered = filtered.filter(p => (p.nome||'').toLowerCase().includes(search));
                if (catFilter) filtered = filtered.filter(p => p.categoria === catFilter);

                $('prod-count').textContent = `${filtered.length} produto${filtered.length!==1?'s':''}`;
                $('prod-tbody').innerHTML = filtered.map(p =>
                    `<tr><td>${escapeHtml(p.nome)}</td><td>${escapeHtml(p.categoria||'—')}</td><td style="text-align:right">${fmtBRL(p.precoVenda)}</td></tr>`
                ).join('');
            }
            render();
            $('prod-search')?.addEventListener('input', render);
            sel.addEventListener('change', render);
        }

        // ── Insumos ──
        function renderConsumerInsumos() {
            const cats = [...new Set(consumerInsumos.map(i => i.categoria).filter(Boolean))].sort();

            $('ins-kpis').innerHTML = `
                <div class="cons-kpi-card"><div class="cons-kpi-label">Total Insumos</div><div class="cons-kpi-value">${consumerInsumos.length}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Categorias</div><div class="cons-kpi-value">${cats.length}</div></div>
            `;

            const sel = $('ins-cat-filter');
            sel.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

            function render() {
                const search = ($('ins-search')?.value || '').toLowerCase();
                const catFilter = $('ins-cat-filter')?.value || '';
                let filtered = consumerInsumos;
                if (search) filtered = filtered.filter(i => (i.nome||'').toLowerCase().includes(search));
                if (catFilter) filtered = filtered.filter(i => i.categoria === catFilter);

                $('ins-count').textContent = `${filtered.length} insumo${filtered.length!==1?'s':''}`;
                $('ins-tbody').innerHTML = filtered.map(i =>
                    `<tr><td>${escapeHtml(i.nome)}</td><td>${escapeHtml(i.categoria||'—')}</td></tr>`
                ).join('');
            }
            render();
            $('ins-search')?.addEventListener('input', render);
            sel.addEventListener('change', render);
        }

        // ── Estoque ──
        function renderEstoque(estData) {
            const total = estoqueData.length;
            const comMinimo = estData.comMinimo || 0;
            const baixo = estData.estoqueBaixo || 0;
            const atencao = estData.estoqueAtencao || 0;

            $('estoque-kpis').innerHTML = `
                <div class="cons-kpi-card"><div class="cons-kpi-label">Itens com Estoque</div><div class="cons-kpi-value">${total}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Com Mínimo Definido</div><div class="cons-kpi-value">${comMinimo}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Estoque Baixo</div><div class="cons-kpi-value" style="color:#ef4444">${baixo}</div></div>
                <div class="cons-kpi-card"><div class="cons-kpi-label">Atenção</div><div class="cons-kpi-value" style="color:#f59e0b">${atencao}</div></div>
            `;

            const cats = [...new Set(estoqueData.map(i => i.categoria).filter(Boolean))].sort();
            const catSel = $('estoque-cat-filter');
            catSel.innerHTML = '<option value="">Todas categorias</option>' + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

            function render() {
                const search = ($('estoque-search')?.value || '').toLowerCase();
                const statusFilter = $('estoque-status-filter')?.value || '';
                const catFilter = $('estoque-cat-filter')?.value || '';
                let filtered = estoqueData;
                if (search) filtered = filtered.filter(i => (i.nome||'').toLowerCase().includes(search));
                if (statusFilter) filtered = filtered.filter(i => i.status === statusFilter);
                if (catFilter) filtered = filtered.filter(i => i.categoria === catFilter);

                filtered = filtered.sort((a,b) => {
                    const order = {baixo:0, atencao:1, ok:2};
                    return (order[a.status]||9) - (order[b.status]||9) || (a.nome||'').localeCompare(b.nome||'','pt-BR');
                });

                $('estoque-count').textContent = `${filtered.length} ite${filtered.length!==1?'ns':'m'}`;
                const statusLabels = {baixo:'Baixo', atencao:'Atenção', ok:'OK'};
                $('estoque-tbody').innerHTML = filtered.map(i => {
                    const badge = `<span class="stock-badge stock-${i.status}">${statusLabels[i.status]||'—'}</span>`;
                    return `<tr><td>${escapeHtml(i.nome)}</td><td>${escapeHtml(i.categoria||'—')}</td><td style="text-align:right;font-weight:600">${i.estoqueAtual}</td><td style="text-align:right">${i.estoqueMinimo > 0 ? i.estoqueMinimo : '—'}</td><td>${i.estoqueMinimo > 0 ? badge : '—'}</td></tr>`;
                }).join('');
            }
            render();
            $('estoque-search')?.addEventListener('input', render);
            $('estoque-status-filter')?.addEventListener('change', render);
            catSel.addEventListener('change', render);
        }
    </script>
</body>
</html>
