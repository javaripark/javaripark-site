<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta de Evento — Javari StrEat Park</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        :root{--purple:#4f1964;--gold:#b8860b;--ink:#1f1822;--muted:#7a7280}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Inter',sans-serif;background:#faf8f5;color:var(--ink);line-height:1.55;padding-bottom:90px}
        .wrap{max-width:760px;margin:0 auto}
        /* Hero */
        .hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
        .hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
        .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,15,30,.35) 0%,rgba(26,15,30,.85) 100%)}
        .hero .inner{position:relative;padding:26px 22px 30px;width:100%;max-width:760px;margin:0 auto}
        .hero .logo{height:46px;margin-bottom:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
        .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
        .hero h1{font-size:2.1em;font-weight:800;line-height:1.1;margin-bottom:10px}
        .hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;font-weight:500;opacity:.95}
        .hero .meta span{display:flex;align-items:center;gap:6px}
        /* Sections */
        .sec{padding:30px 22px}
        .sec h2{font-size:1.25em;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px}
        .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
        .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(79,25,100,.06)}
        .card .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
        .card .val{font-size:1.25em;font-weight:700;margin-top:4px}
        /* Pacote */
        .item{display:flex;align-items:center;gap:13px;background:#fff;border-radius:13px;padding:13px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(79,25,100,.05)}
        .item .ic{font-size:1.5em;width:30px;text-align:center}
        .item .nm{flex:1;font-weight:600}
        .item .qt{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
        /* Galeria */
        .gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin:0 -22px;padding-left:22px;padding-right:22px}
        .gallery figure{scroll-snap-align:start;flex:0 0 78%;max-width:300px;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.12)}
        .gallery img{width:100%;height:210px;object-fit:cover;display:block}
        .gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:13px;font-weight:600}
        /* Investimento */
        .invest{background:linear-gradient(135deg,#2d1640,#4f1964);color:#fff;border-radius:20px;margin:0 22px;padding:26px 22px}
        .invest h2{color:#fff}
        .invest .line{display:flex;justify-content:space-between;padding:9px 0;font-size:15px;border-bottom:1px solid rgba(255,255,255,.12)}
        .invest .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
        .invest .total .t{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:700}
        .invest .total .v{font-size:2.1em;font-weight:800}
        /* Accordion */
        .acc{background:#fff;border-radius:13px;margin-bottom:10px;box-shadow:0 2px 10px rgba(79,25,100,.05);overflow:hidden}
        .acc summary{padding:16px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
        .acc summary::-webkit-details-marker{display:none}
        .acc summary::after{content:'＋';color:var(--purple);font-weight:700}
        .acc[open] summary::after{content:'－'}
        .acc .body{padding:0 18px 18px;font-size:14px;color:#4a4450}
        .acc .body ul{list-style:none}
        .acc .body li{padding:4px 0 4px 20px;position:relative}
        .acc .body li::before{content:'•';position:absolute;left:4px;color:var(--purple)}
        .acc .body .ok li::before{content:'✓';color:#16a34a}
        .acc .body .no li::before{content:'✕';color:#ef4444}
        .acc .body h4{font-size:13px;margin:12px 0 4px;color:var(--ink)}
        footer{padding:30px 22px;text-align:center;color:var(--muted);font-size:13px}
        footer .nm{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:6px}
        /* CTA bar */
        .cta{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.1);padding:12px 16px;display:flex;gap:10px;max-width:760px;margin:0 auto;z-index:50}
        .cta button,.cta a{flex:1;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;font-family:inherit}
        .cta .pdf{background:#f0ebf3;color:var(--purple);flex:0 0 38%}
        .cta .wa{background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
        #loading{padding:80px 22px;text-align:center;color:var(--muted)}
        @media(min-width:760px){.gallery figure{flex-basis:46%}}
    </style>
</head>
<body>
    <div id="loading">Carregando proposta…</div>
    <div class="wrap" id="app" style="display:none">
        <section class="hero">
            <img class="bg" src="/assets/images/cotacao-hero.webp" alt="">
            <div class="ov"></div>
            <div class="inner">
                <img class="logo" src="/assets/images/logo-horizontal-white.png" alt="Javari StrEat Park">
                <div class="eyebrow">Proposta de Evento</div>
                <h1 id="h-titulo"></h1>
                <div class="meta" id="h-meta"></div>
            </div>
        </section>

        <section class="sec"><div class="cards" id="detalhes"></div></section>

        <section class="sec">
            <h2>🎉 O que está incluído</h2>
            <div id="pacote"></div>
        </section>

        <section class="sec">
            <h2>📸 O nosso espaço</h2>
        </section>
        <div class="gallery" id="galeria"></div>

        <section class="sec">
            <div class="invest">
                <h2>💳 Investimento</h2>
                <div id="invest-lines"></div>
                <div class="total"><span class="t">Total</span><span class="v" id="invest-total"></span></div>
            </div>
        </section>

        <section class="sec">
            <h2>📋 Condições</h2>
            <details class="acc"><summary>💰 Forma de pagamento</summary><div class="body" id="c-pag"></div></details>
            <details class="acc"><summary>📑 Condições gerais</summary><div class="body" id="c-cond"></div></details>
            <details class="acc"><summary>🛡️ Revista pessoal</summary><div class="body" id="c-revista"></div></details>
        </section>

        <footer id="rodape"></footer>

        <div class="cta">
            <button class="pdf" id="btn-pdf">⬇ PDF</button>
            <a class="wa" id="btn-wa" target="_blank" rel="noopener">💬 Falar no WhatsApp</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const fbCfg={ apiKey:"AIzaSyBPsAFkMBXtmlv6UvavXGdD86nWz9b__18", authDomain:"central-de-reservas-jsp.firebaseapp.com", projectId:"central-de-reservas-jsp", storageBucket:"central-de-reservas-jsp.firebasestorage.app", appId:"1:574859111927:web:83df67ed1865a59c0392f2" };
        const db=getFirestore(initializeApp(fbCfg));
        const $=id=>document.getElementById(id);
        const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
        const fmtDateBR=s=>{ if(!s)return''; const p=String(s).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s; };
        const DEFAULT_GALERIA=[{src:'quintal/quintal-aniversario.webp',cap:'Aniversários no quintal'},{src:'quintal/quintal-happyhour.webp',cap:'Happy hour'},{src:'bus-lounge/bus-01.webp',cap:'Bus Lounge'},{src:'quintal/quintal-oasis.webp',cap:'O quintal'},{src:'drinks/cerveja-trincando.webp',cap:'Sempre trincando'},{src:'drinks/drink-01.webp',cap:'Drinks da casa'},{src:'clientes/cliente-01.webp',cap:'Quem já comemorou aqui'},{src:'quintal/quintal-bora.webp',cap:'Vem pro Javari'}];
        function itemIcon(n){ n=(n||'').toLowerCase(); if(/caipir|gin|drink|vodka|negroni|aperol|cocktail/.test(n))return'🍹'; if(/cerveja|chopp|heineken|brahma|eisenbahn|ipa|long neck|lager|pilsen|amstel|patagonia/.test(n))return'🍺'; if(/água|agua|refri|suco|coca|guaran|tônica|jarra/.test(n))return'🥤'; if(/coxinha|baguete|porç|porc|petisc|frita|dadinho|torresmo|isca|bolinho|linguiç|calabres/.test(n))return'🍴'; return'🎈'; }
        function waNumber(tel){ let d=String(tel||'').replace(/\D/g,'').replace(/^0+/,''); if(d.length<=11) d='55'+d; return d; }

        async function load(){
            const id=new URLSearchParams(location.search).get('id');
            if(!id){ $('loading').textContent='Proposta não encontrada.'; return; }
            let p;
            try{ const snap=await getDoc(doc(db,'artifacts/central-de-reservas-jsp/public/data/eventos_propostas',id)); if(!snap.exists()){ $('loading').textContent='Proposta não encontrada ou expirada.'; return; } p=snap.data(); }
            catch(e){ $('loading').textContent='Erro ao carregar a proposta.'; return; }
            render(p); $('loading').style.display='none'; $('app').style.display='block';
        }
        function render(p){
            const cfg=p.cfg||{};
            $('h-titulo').textContent = p.empresa ? `Proposta para ${p.empresa}` : 'Seu evento no Javari';
            $('h-meta').innerHTML = [p.dataEvento?`<span>📅 ${fmtDateBR(p.dataEvento)}</span>`:'', p.pessoas?`<span>👥 ${p.pessoas} pessoas</span>`:'', p.duracao?`<span>⏰ ${p.duracao}h</span>`:''].join('');
            $('detalhes').innerHTML = [['Pacote',p.pacoteNome||'—'],['Pessoas',p.pessoas||'—'],['Data',fmtDateBR(p.dataEvento)||'a definir']].map(([l,v])=>`<div class="card"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('');
            $('pacote').innerHTML = (p.itens||[]).map(i=>`<div class="item"><div class="ic">${itemIcon(i.nome)}</div><div class="nm">${i.nome}</div><div class="qt">${p.isOpen?`${i.qtd} /pessoa`:`${i.qtd} un`}</div></div>`).join('') || '<p style="color:var(--muted)">Pacote personalizado.</p>';
            const galeria = (p.galeria&&p.galeria.length)?p.galeria:DEFAULT_GALERIA;
            $('galeria').innerHTML = galeria.map(g=>`<figure><img loading="lazy" src="/assets/images/${g.src}" alt="${g.cap||''}"><figcaption>${g.cap||''}</figcaption></figure>`).join('');
            const lines=[]; lines.push([p.isOpen?`Pacote · ${brl(p.preco)} × ${p.pessoas} pessoas`:'Pacote (fechado)', brl(p.pkgReceita)]); (p.extrasRepassados||[]).forEach(e=>lines.push([e.desc, brl(e.valor)]));
            $('invest-lines').innerHTML = lines.map(([l,v])=>`<div class="line"><span>${l}</span><span>${v}</span></div>`).join('');
            $('invest-total').textContent = brl(p.total);
            $('c-pag').innerHTML = '<ul>'+String(cfg.pagamento||'').split('\n').filter(Boolean).map(l=>`<li>${l}</li>`).join('')+'</ul>';
            $('c-cond').innerHTML = '<ul>'+String(cfg.condicoes||'').split('\n').filter(Boolean).map(l=>`<li>${l.replace(/^[-–•]\s*/,'')}</li>`).join('')+'</ul>';
            $('c-revista').innerHTML = `<p>${cfg.revistaIntro||''}</p><h4 style="color:#16a34a">Itens autorizados</h4><ul class="ok">${String(cfg.autorizados||'').split('\n').filter(Boolean).map(l=>`<li>${l}</li>`).join('')}</ul><h4 style="color:#ef4444">Itens proibidos</h4><ul class="no">${String(cfg.proibidos||'').split('\n').filter(Boolean).map(l=>`<li>${l}</li>`).join('')}</ul><p style="margin-top:10px;font-style:italic;color:var(--muted)">${cfg.revistaObs||''}</p>`;
            $('rodape').innerHTML = `<div class="nm">${cfg.nome||'Javari Streat Park'}</div>${cfg.endereco||''}<br>${cfg.telefone||''} · ${cfg.site||''}<br>${cfg.instagram||''}`;
            const msg = encodeURIComponent(`Olá! Vi a proposta do evento${p.empresa?' para '+p.empresa:''}${p.dataEvento?' ('+fmtDateBR(p.dataEvento)+', '+p.pessoas+' pessoas)':''} e quero fechar. Podemos falar?`);
            $('btn-wa').href = `https://wa.me/${waNumber(cfg.telefone)}?text=${msg}`;
            $('btn-pdf').addEventListener('click', ()=>gerarPDF(p));
        }

        // Converte webp->jpeg. Se targetAR for passado, recorta (cover) pra essa proporção — sem esticar.
        function webpToJpeg(src, targetAR){ return new Promise(res=>{ const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0; if(targetAR){ const ar=sw/sh; if(ar>targetAR){ const nw=sh*targetAR; sx=(sw-nw)/2; sw=nw; } else { const nh=sw/targetAR; sy=(sh-nh)/2; sh=nh; } } const cv=document.createElement('canvas'); cv.width=sw; cv.height=sh; cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,sw,sh); try{ res({data:cv.toDataURL('image/jpeg',0.85)}); }catch(e){ res(null); } }; img.onerror=()=>res(null); img.src=src; }); }
        async function pngData(src){ try{ const b=await fetch(src).then(r=>r.blob()); return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);}); }catch(e){ return null; } }
        async function gerarPDF(p){
            const cfg=p.cfg||{}; const { jsPDF }=window.jspdf; const d=new jsPDF({unit:'mm',format:'a4'});
            const M=18, W=210, CW=W-2*M, PH=297; let y=0;
            const ensure=h=>{ if(y+h>PH-M){ d.addPage(); y=M; } };
            const para=(t,s=10,st='normal',c=[70,70,70])=>{ d.setFont('helvetica',st); d.setFontSize(s); d.setTextColor(...c); d.splitTextToSize(String(t||''),CW).forEach(l=>{ ensure(s*0.5+1); d.text(l,M,y); y+=s*0.5+1; }); };
            const head=t=>{ y+=7; ensure(11); d.setFillColor(79,25,100); d.rect(M,y-1,2.6,6.5,'F'); d.setTextColor(79,25,100); d.setFont('helvetica','bold'); d.setFontSize(11.5); d.text(String(t).toUpperCase(),M+6,y+3.6); y+=10; };
            const bullets=t=>String(t||'').split('\n').filter(s=>s.trim()).forEach(line=>{ const x=line.replace(/^[-–•]\s*/,''); d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(70,70,70); d.splitTextToSize(x,CW-6).forEach((l,i)=>{ ensure(5.6); if(i===0){d.setTextColor(79,25,100);d.text('•',M,y);d.setTextColor(70,70,70);} d.text(l,M+5,y); y+=5.6; }); y+=1; });
            // capa com foto
            const hh=64; const hero=await webpToJpeg('/assets/images/cotacao-hero.webp', W/hh);
            if(hero){ try{ d.addImage(hero.data,'JPEG',0,0,W,hh); }catch(e){} d.setFillColor(26,15,30); d.setGState&&d.setGState(new d.GState({opacity:0.4})); d.rect(0,0,W,hh,'F'); d.setGState&&d.setGState(new d.GState({opacity:1})); y=hh+12; } else y=M;
            const logo=await pngData('/assets/images/logo-horizontal-black.png');
            if(logo){ const lw=44; try{ d.addImage(logo,'PNG',M,y-6,lw,lw*430/800); }catch(e){} y+=lw*430/800+2; }
            d.setFont('helvetica','bold'); d.setFontSize(17); d.setTextColor(25,25,25); ensure(8); d.text(p.empresa?`Proposta — ${p.empresa}`:'Proposta de Evento',M,y); y+=4;
            d.setDrawColor(225,220,230); d.line(M,y,W-M,y); y+=2;
            head('Dados do evento');
            [['Empresa / Cliente',p.empresa||'—'],['Contato',p.contato||'—'],['Data do evento',fmtDateBR(p.dataEvento)||'—'],['Nº de pessoas',String(p.pessoas||'')],['Duração',(p.duracao||'')+'h']].forEach(([k,v])=>{ ensure(6.2); d.setFont('helvetica','bold'); d.setFontSize(10); d.setTextColor(110,110,110); d.text(k,M,y); d.setFont('helvetica','normal'); d.setTextColor(40,40,40); d.text(String(v),M+48,y); y+=6; });
            head('Pacote: '+(p.pacoteNome||''));
            (p.itens||[]).forEach(i=>{ ensure(5.6); d.setFont('helvetica','normal'); d.setFontSize(10); d.setTextColor(75,75,75); d.text(`•  ${i.nome}`,M+1,y); d.text(p.isOpen?`${i.qtd} /pessoa`:`${i.qtd} un`,W-M,y,{align:'right'}); y+=5.6; });
            head('Investimento');
            d.setFont('helvetica','normal'); d.setFontSize(10.5); d.setTextColor(55,55,55); ensure(6.5);
            d.text(p.isOpen?`Pacote: ${brl(p.preco)} por pessoa × ${p.pessoas} pessoas`:'Pacote (fechado)',M,y); d.text(brl(p.pkgReceita),W-M,y,{align:'right'}); y+=6.5;
            (p.extrasRepassados||[]).forEach(e=>{ ensure(6); d.text('+ '+e.desc,M,y); d.text(brl(e.valor),W-M,y,{align:'right'}); y+=6; });
            y+=2; ensure(11); d.setFillColor(245,240,248); d.rect(M,y-5,CW,9,'F'); d.setFont('helvetica','bold'); d.setFontSize(14); d.setTextColor(79,25,100); d.text('Total',M+3,y+1.5); d.text(brl(p.total),W-M-3,y+1.5,{align:'right'}); y+=10;
            head('Forma de pagamento'); para(cfg.pagamento);
            head('Condições gerais'); bullets(cfg.condicoes);
            head('Revista pessoal'); para(cfg.revistaIntro);
            y+=2; ensure(6); d.setFont('helvetica','bold'); d.setFontSize(10); d.setTextColor(22,163,74); d.text('Itens autorizados',M,y); y+=6; bullets(cfg.autorizados);
            y+=1; ensure(6); d.setFont('helvetica','bold'); d.setFontSize(10); d.setTextColor(220,38,38); d.text('Itens proibidos',M,y); y+=6; bullets(cfg.proibidos);
            y+=1; para(cfg.revistaObs,9.5,'italic',[120,120,120]);
            y+=7; ensure(24); d.setDrawColor(220,218,224); d.line(M,y,W-M,y); y+=6;
            d.setFont('helvetica','bold'); d.setFontSize(10.5); d.setTextColor(40,40,40); d.text(cfg.nome||'Javari Streat Park',M,y); y+=5.5;
            d.setFont('helvetica','normal'); d.setFontSize(9.5); d.setTextColor(100,100,100);
            [cfg.endereco,'Tel/WhatsApp: '+cfg.telefone,cfg.site,'Instagram: '+cfg.instagram].forEach(l=>{ ensure(5); d.text(String(l||''),M,y); y+=5; });
            d.save(`Proposta-Javari-${(p.empresa||'evento').replace(/[^a-z0-9]/gi,'-')}.pdf`);
        }
        load();
    </script>
</body>
</html>
