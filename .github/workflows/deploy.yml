name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar version.json (commit + data do deploy)
        run: |
          echo "{\"commit\":\"${GITHUB_SHA:0:7}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"ref\":\"${GITHUB_REF_NAME}\"}" > public/version.json
          cat public/version.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
