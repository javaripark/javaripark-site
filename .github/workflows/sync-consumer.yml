name: Sync Consumer → Dashboard

on:
  schedule:
    # Roda cedo pra ter dados prontos antes das 7h BRT (o GitHub costuma atrasar ~1-2h).
    - cron: '0 7 * * *'    # 07:00 UTC = 04:00 BRT (principal)
    - cron: '0 9 * * *'    # 09:00 UTC = 06:00 BRT (rede de segurança, caso o 1º atrase/pule)
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firebird 4.0
        run: |
          wget -q https://github.com/FirebirdSQL/firebird/releases/download/v4.0.7/Firebird-4.0.7.3271-0.amd64.tar.gz -O /tmp/fb4.tar.gz
          tar xzf /tmp/fb4.tar.gz -C /tmp
          cd /tmp/Firebird-4.0.7.3271-0.amd64 && sudo ./install.sh -silent
          sudo mkdir -p /tmp/firebird && sudo chmod 777 /tmp/firebird
          sudo chmod -R 777 /opt/firebird
          /opt/firebird/bin/gbak -z 2>&1 | head -3 || true

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth firebase-admin firebird-driver

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: central-de-reservas-jsp
        run: python scripts/sync-consumer.py

      - name: Commit and push updated JSON data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "data: sync Consumer POS $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
