name: Sync Consumer → Dashboard

on:
  schedule:
    - cron: '0 11 * * *'   # Every day at 11:00 UTC (08:00 BRT)
  workflow_dispatch:        # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firebird 4.0
        run: |
          wget -q https://github.com/FirebirdSQL/firebird/releases/download/v4.0.6/Firebird-4.0.6.3075-0.amd64.tar.gz -O /tmp/fb4.tar.gz
          tar xzf /tmp/fb4.tar.gz -C /tmp
          cd /tmp/Firebird-4.0.6.3075-0.amd64 && sudo ./install.sh -silent
          gbak -z 2>&1 | head -3 || /opt/firebird/bin/gbak -z 2>&1 | head -3 || true

      - name: Install Python dependencies
        run: pip install google-api-python-client google-auth firebase-admin firebird-driver

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: central-de-reservas-jsp
        run: python scripts/sync-consumer.py
